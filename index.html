<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Google tag (gtag.js) — Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-8XB8C4F0WR"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-8XB8C4F0WR', { send_page_view: false });
    </script>

    <!-- Favicons — PNG fallbacks alongside SVG: Google's search-result favicon
         crawler and Apple's home-screen icon are both unreliable with SVG-only icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180x180.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="msapplication-TileImage" content="/favicon-192x192.png" />
    <meta name="msapplication-TileColor" content="#0c0c0c" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Route-specific head tags (title, description, canonical, OG/Twitter)
      are owned by react-helmet-async per page and baked into static HTML
      by scripts/prerender.mjs at build time. Do not add a canonical or
      og:url here — it would ship on every route and mark all landing
      pages as duplicates of the homepage.
    -->
    <!--
      No default robots meta tag here on purpose. react-helmet-async can only
      ADD tags to this shell, never remove the static one — so pages that set
      their own directive (Admin, Privacy, Refunds, Terms, ThankYou) would end
      up shipping two conflicting <meta name="robots"> tags. Omitting a tag
      defaults to index,follow per spec, which is correct for every public
      page; the 5 opt-out pages set their own via Helmet with nothing to
      conflict against.
    -->
    <meta name="author" content="DJ DX" />
    <meta name="theme-color" content="#0c0c0c" />

    <!-- Geo targeting -->
    <meta name="geo.region" content="US-NY" />
    <meta name="geo.placename" content="New York, NY — Tri-State Area (NY, NJ, CT)" />
    <meta name="geo.position" content="40.7128;-74.0060" />
    <meta name="ICBM" content="40.7128, -74.0060" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://i.ytimg.com" />

    <!--
      JSON-LD — Person + MusicGroup. This is the single canonical entity
      block for #djdx — it used to be duplicated (with a different,
      conflicting description/sameAs) in App.tsx's homepage-only Helmet.
      react-helmet-async can only ADD script tags to this static shell,
      never remove one, so both versions shipped simultaneously on the
      homepage under the identical @id. Consolidated here since this
      block ships globally on every route; App.tsx's duplicate was
      deleted rather than merged-and-kept-separate.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["Person", "MusicGroup", "EntertainmentBusiness", "LocalBusiness"],
      "@id": "https://djdxmusic.com/#djdx",
      "name": "DJ DX",
      "alternateName": ["El Negro", "Robert Van Liew"],
      "url": "https://djdxmusic.com/",
      "publication": {
        "@type": "Periodical",
        "name": "The DX Report",
        "url": "https://djdxmusic.com/news",
        "description": "The official news publication of DJ DX — covering music releases, events, and culture."
      },
      "description": "DJ DX (born Robert Van Liew) was born and raised in Jersey City, New Jersey, and has been DJing since 1998. He built his name there blending Hip-Hop and R&B mixtapes, distributed independently on the streets of Jersey City and online, then Reggaeton — that's where the name 'El Negro' came from. In 2011, he began writing and recording his own original music. Since then he's released the concept album 'The Unfortunate Child' (2014) and the album 'Made From Scratch', along with singles including '1,000 Reasons,' a 'Dark Paradise' remix with Lana Del Rey, and a 'Make It a Better Day' remix featuring 2Pac. In 2024, he formed Soul Shades with violinist Julie Schatz; their remix of Nimino's 'I Only Smoke When I Drink' and Sting's 'Englishman in New York' was featured by UK label Ninja Tune and has drawn over 10 million views across TikTok and Instagram. DJ DX performed at TEDxYouth@RVA in 2022, featured on TED.com, and has been covered by NJ.com/The Jersey Journal and RVA Magazine. He has released 100+ original productions and performed 500+ live events across the tri-state area.",
      "image": "https://djdxmusic.com/show-1.jpg",
      "jobTitle": ["DJ", "Music Producer", "Recording Artist"],
      "genre": ["R&B", "Hip-Hop", "Afrobeats", "House", "Jersey Club", "Reggaeton", "Old School", "Blends & Remixes"],
      "knowsAbout": ["DJing", "Music Production", "R&B", "Hip-Hop", "Afrobeats", "House Music", "Jersey Club", "Live Performance", "Wedding DJ", "Corporate Event DJ", "Club DJ", "Music Blending"],
      "foundingLocation": {
        "@type": "Place",
        "name": "Jersey City, New Jersey, USA"
      },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "New York",
        "addressRegion": "NY",
        "addressCountry": "US"
      },
      "email": "bookings@djdxmusic.com",
      "priceRange": "$$-$$$",
      "areaServed": [
        {"@type": "City", "name": "New York City"},
        {"@type": "State", "name": "New Jersey"},
        {"@type": "AdministrativeArea", "name": "Tri-State Area"}
      ],
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "5.0",
        "reviewCount": "6",
        "bestRating": "5",
        "worstRating": "1"
      },
      "award": "Featured performer at TEDxYouth@RVA 2022",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "DJ Services",
        "itemListElement": [
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Wedding DJ", "description": "Professional wedding DJ services in New York and New Jersey"}},
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Corporate Event DJ", "description": "Corporate event DJ in New York City and New Jersey"}},
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Club & Venue DJ", "description": "Nightclub and live venue DJ sets in the NYC/NJ area"}},
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Live Violinist & DJ Package", "description": "Unique fusion of live violin over DJ sets for upscale events"}}
        ]
      },
      "sameAs": [
        "https://open.spotify.com/artist/4gGFdpDwEe8zIY1XSE3dGe",
        "https://music.apple.com/us/artist/dj-dx/1035405039",
        "https://www.youtube.com/channel/UCqXcClmim62rc3Jqnzp855w",
        "https://www.youtube.com/c/djdxmusic",
        "https://www.youtube.com/@djdxmusic",
        "https://twitter.com/djdxmusic",
        "https://www.instagram.com/djdx",
        "https://facebook.com/djdxmusic",
        "https://www.tiktok.com/@djdxmusic",
        "https://www.wikidata.org/wiki/Q17579958",
        "https://musicbrainz.org/artist/8a6ee50a-8713-4828-a42f-8aa8f9579d6b",
        "https://isni.org/isni/0000000466004223",
        "https://www.freebase.com/m/0h88rm_",
        "https://genius.com/artists/Dj-dx",
        "https://www.imdb.com/name/nm15146879",
        "https://www.whosampled.com/DJ-DX/",
        "https://www.ted.com/talks/dj_dx_finally_moving",
        "https://disruptmagazine.com/dj-dx-leads-the-music-industry-into-the-metaverse/",
        "https://voyageatl.com/interview/life-work-with-robert-van-liew-of-national/",
        "https://share.google/v7RARn4fdsghIcXyX",
        "https://profile.google.com/@djdxmusic"
      ]
    }
    </script>
    <!--
      "event" (TEDxYouth@RVA MusicEvent) and "subjectOf" (press articles,
      video features, the Ninja Tune feature) used to live inside the
      #djdx block above — since that block is global (ships on every
      route), Google Search Console's Video indexing report started
      flagging the same HearRVA/TED video metadata as present on a
      dozen unrelated SEO landing pages ('Video isn't on a watch page').
      Moved here as a homepage-only supplementary declaration (App.tsx's
      Helmet references the same @id) so press/media content only ships
      where it's actually topical.
    -->

    <!-- JSON-LD — WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://djdxmusic.com/#website",
      "name": "DJ DX",

    <script type="application/ld+json">
